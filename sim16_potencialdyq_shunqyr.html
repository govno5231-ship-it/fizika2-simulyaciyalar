<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Потенциалдық шұңқырдағы бөлшек. Де Бройль толқыны</title><link rel="stylesheet" href="sim.css"></head>
<body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="sim.js"></script>
<script>
const K=0.376; // h²/(8 m_e) = 0,376 эВ·нм²
const NB=80; let bars=[],psiLine,wallL,wallR;
const psi=(n,x,L)=>Math.sqrt(2/L)*Math.sin(n*Math.PI*x/L);
Sim.init({
  lecture:'Дәріс 11 · Кванттық механика элементтері', title:'Бір өлшемді терең потенциалдық шұңқырдағы бөлшек',
  formulas:['ψ<sub>n</sub>(x) = √(2/L)·sin(nπx/L),&nbsp; n = 1, 2, 3, …','E<sub>n</sub> = π²ħ²n²/(2mL²) = n²h²/(8mL²)','λ<sub>Б</sub> = h/p = 2L/n&nbsp; (шұңқырға бүтін жарты толқын сияды)','dP = |ψ|²dx,&nbsp; ∫|ψ|²dx = 1'],
  symbols:'L — шұңқыр ені, n — кванттық сан, ψ — толқындық функция, |ψ|² — ықтималдық тығыздығы, λ<sub>Б</sub> — де Бройль толқын ұзындығы.',
  controls:[
    {id:'mode',type:'select',label:'Күй',value:'stat',options:[['stat','Стационар күй ψ<sub>n</sub>'.replace(/<[^>]+>/g,'')],['sup','Екі күйдің қосындысы (ψₙ + ψₙ₊₁)']]},
    {id:'n',label:'Кванттық сан n',min:1,max:6,step:1,value:2,unit:'',dec:0},
    {id:'L',label:'Шұңқыр ені L',min:0.2,max:2,step:0.05,value:1,unit:'нм'}
  ],
  readouts:[{id:'E',label:'E_n, эВ'},{id:'E1',label:'E₁, эВ'},{id:'lam',label:'λ_Б = 2L/n, нм'},{id:'nodes',label:'Түйіндер саны (n − 1)'},{id:'P',label:'P(0 < x < L/4)'},{id:'cl',label:'Классикалық P = 25 %'}],
  plots:[{id:'p',title:'ψ(x) және |ψ|²(x)',xlabel:'x / L',ylabel:'ψ, |ψ|² (L=1 бірлікте)'},{id:'e',title:'Энергия деңгейлері',xlabel:'n',ylabel:'E, эВ'}],
  theory:'<p>Шексіз терең шұңқырда бөлшектің энергиясы <b>дискретті</b>: E<sub>n</sub> ~ n². Толқындық функция шұңқыр қабырғасында нөлге тең (шекаралық шарт), сондықтан шұңқырға бүтін жарты де Бройль толқындары сияды: L = nλ/2.</p><p>Классикалық бөлшекте барлық нүктеде табу ықтималдығы бірдей, ал кванттық бөлшекте |ψ|² максимум мен түйіндерге ие. Екі күйдің қосындысында ықтималдық тығыздығы (E<sub>n+1</sub> − E<sub>n</sub>)/ħ жиілігімен «тербеледі».</p>',
  result:'<b>Тексеріңіз:</b> L-ді екі есе кішірейтсеңіз, барлық E<sub>n</sub> төрт есе артады. n = 1 күйде E<sub>1</sub> ≠ 0 (нөлдік энергия) — бұл анықталмағандық принципінің салдары.',
  camera:{r:15,th:1.15,ph:0.5,target:[0,2,0]},
  setup(c){ const {scene,THREE}=c; scene.add(Sim.grid(20,0));
    const wm=new THREE.MeshPhongMaterial({color:0x8899aa}); wallL=new THREE.Mesh(new THREE.BoxGeometry(0.4,7,3),wm); wallR=wallL.clone(); scene.add(wallL,wallR); wallL.position.set(-5.2,3.5,0); wallR.position.set(5.2,3.5,0);
    for(let i=0;i<NB;i++){ const m=new THREE.Mesh(new THREE.BoxGeometry(10/NB*0.9,1,1.4),new THREE.MeshPhongMaterial({color:0x66aaff,transparent:true,opacity:0.75})); m.position.z=-0.2; scene.add(m); bars.push(m); }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(200*3),3)); psiLine=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffdd44})); psiLine.frustumCulled=false; scene.add(psiLine);
    const l=Sim.label('жолақ — |ψ|²,  сызық — ψ',{size:0.8}); l.position.set(0,7.6,0); scene.add(l); },
  reset(c){},
  frame(dt,c,run){
    const S=c.S,p=S.params; if(run) S.t+=dt; const n=Math.round(p.n), L=p.L; const sup=p.mode==='sup'; const ph=2*Math.PI*S.t/4; const m=n+1;
    const f=(x)=>{ if(!sup) return {a:psi(n,x,L),d:psi(n,x,L)**2}; const a=psi(n,x,L),b=psi(m,x,L); return {a:(a*Math.cos(0)+b*Math.cos(ph))/Math.SQRT2*0+(a+b*Math.cos(ph))/Math.SQRT2,d:0.5*(a*a+b*b)+a*b*Math.cos(ph)}; };
    const Ls=Math.sqrt(2/L); const pos=psiLine.geometry.attributes.position.array;
    for(let i=0;i<200;i++){ const x=L*i/199; const v=f(x); pos[i*3]=-5+10*i/199; pos[i*3+1]=3.5+v.a/ (Ls*1.8)*2.8*(sup?0.9:1); pos[i*3+2]=0.9; }
    psiLine.geometry.attributes.position.needsUpdate=true;
    for(let i=0;i<NB;i++){ const x=L*(i+0.5)/NB; const d=f(x).d; const H=Math.max(0.02,d/(Ls*Ls*(sup?2:1))*3.0); bars[i].scale.y=H; bars[i].position.set(-5+10*(i+0.5)/NB,H/2,-0.2); }
    const xs=[],ps=[],pd=[]; for(let i=0;i<=200;i++){ const x=i/200; xs.push(x); const v=f(x*L); ps.push(v.a*Math.sqrt(L)); pd.push(v.d*L); }
    S.plots.p.draw({xmin:0,xmax:1,ymin:-2.2,ymax:4.2,series:[{x:xs,y:pd,color:'#0072c6',label:'|ψ|²·L'},{x:xs,y:ps,color:'#d6232a',label:'ψ·√L'},{x:[0,1],y:[1,1],color:'#7b8aa0',dash:[5,4],w:1.2,label:'классик.'}]});
    const ex=[],ey=[]; for(let k=1;k<=6;k++){ ex.push(k); ey.push(K*k*k/(L*L)); }
    S.plots.e.draw({xmin:0.5,xmax:6.5,ymin:0,ymax:K*36/(L*L)*1.1,series:[{x:ex,y:ey,color:'#1a8f3c'}],markers:[{x:n,y:K*n*n/(L*L)},...(sup?[{x:m,y:K*m*m/(L*L)}]:[])]});
    const P=0.25-Math.sin(n*Math.PI/2)/(2*n*Math.PI);
    S.setRO('E',(K*n*n/(L*L)).toFixed(4)); S.setRO('E1',(K/(L*L)).toFixed(4)); S.setRO('lam',(2*L/n).toFixed(4)); S.setRO('nodes',String(n-1)); S.setRO('P',sup?'t-ға тәуелді':(P*100).toFixed(2)+' %'); S.setRO('cl','25 %');
    S.tag((sup?'Қосынды n='+n+' және n='+m:'ψ'+n)+' · L = '+L.toFixed(2)+' нм');
  }
});
</script></body></html>
