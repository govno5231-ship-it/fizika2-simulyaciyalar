<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Толқындар: жүгіруші және тұрғын толқын</title><link rel="stylesheet" href="sim.css"></head>
<body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="sim.js"></script>
<script>
const NP=120, XL=12; let balls, imesh, curve, mark;
Sim.init({
  lecture:'Дәріс 6 · Толқындар', title:'Серпімді толқындар: жүгіруші және тұрғын толқын',
  formulas:['ξ(x, t) = A·cos(ωt − kx)','k = 2π/λ,&nbsp; ω = 2πν,&nbsp; v = λν = ω/k','Тұрғын толқын: ξ = 2A·cos(kx)·cos(ωt)','Түйін: x = (2n+1)λ/4;&nbsp; шоқ: x = nλ/2'],
  symbols:'ξ — бөлшектің ауытқуы, A — амплитуда, λ — толқын ұзындығы, k — толқындық сан, v — толқынның фазалық жылдамдығы.',
  controls:[
    {id:'mode',type:'select',label:'Толқын түрі',value:'trav',options:[['trav','Көлденең жүгіруші толқын'],['long','Қума (бойлық) жүгіруші толқын'],['stand','Тұрғын толқын (түсетін + шағылған)']]},
    {id:'A',label:'Амплитуда A',min:0.1,max:1,step:0.05,value:0.6,unit:'м'},
    {id:'lam',label:'Толқын ұзындығы λ',min:1,max:8,step:0.1,value:4,unit:'м',dec:1},
    {id:'nu',label:'Жиілік ν',min:0.1,max:2,step:0.05,value:0.5,unit:'Гц'}
  ],
  readouts:[{id:'v',label:'Жылдамдық v = λν, м/с'},{id:'k',label:'Толқындық сан k, 1/м'},{id:'w',label:'Циклдік жиілік ω, рад/с'},{id:'T',label:'Период T, с'}],
  plots:[{id:'s',title:'ξ(x) — берілген мезеттегі «сурет»',xlabel:'x, м',ylabel:'ξ, м'},{id:'t',title:'ξ(t) — x = λ/4 нүктесінің тербелісі',xlabel:'t, с',ylabel:'ξ, м'}],
  theory:'<p>Толқын — тербелістің ортада таралуы. Бөлшектер сақталады, тек энергия тасымалданады. Көлденең толқында бөлшектер таралу бағытына перпендикуляр, қума толқында — таралу бағытымен тербеледі.</p><p>Тұрғын толқында түйіндер (ξ = 0) мен шоқтар (амплитуда 2A) қозғалмайды — қызыл бөлшектер түйіндер.</p>',
  result:'<b>Бақылау:</b> ν-ны арттырсақ, λ тұрақты кезде v = λν артады. Толқын таралғанда бөлшектер тек өз орнында тербеледі. Тұрғын толқында қатарлас түйіндер арасы λ/2.',
  camera:{r:20,th:1.15,ph:0.4,target:[0,0,0]},
  setup(c){ const {scene,THREE}=c; scene.add(Sim.grid(26,-3));
    const geo=new THREE.SphereGeometry(0.11,10,8); imesh=new THREE.InstancedMesh(geo,new THREE.MeshPhongMaterial({color:0x66ccff}),NP); scene.add(imesh);
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NP*3),3)); curve=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.45})); curve.frustumCulled=false; scene.add(curve);
    mark=new THREE.Mesh(new THREE.SphereGeometry(0.2,16,12),new THREE.MeshBasicMaterial({color:0xff4444})); scene.add(mark);
    const ax=new THREE.Mesh(new THREE.BoxGeometry(XL*2+1,0.02,0.02),new THREE.MeshBasicMaterial({color:0x5588aa})); scene.add(ax); },
  reset(c){},
  frame(dt,c,run){
    const S=c.S,p=S.params; if(run) S.t+=dt; const t=S.t;
    const k=2*Math.PI/p.lam, w=2*Math.PI*p.nu, v=p.lam*p.nu, T=1/p.nu;
    const xi=(x,tt)=> p.mode==='stand'? 2*p.A*Math.cos(k*x)*Math.cos(w*tt) : p.A*Math.cos(w*tt-k*x);
    const m=new THREE.Matrix4(), pos=curve.geometry.attributes.position.array; const sc=1.0;
    for(let i=0;i<NP;i++){ const x0=-XL+2*XL*i/(NP-1); const u=xi(x0,t); let X=x0,Y=0;
      if(p.mode==='long'){ X=x0+u; } else { Y=u; }
      if(p.mode==='stand'&&Math.abs(Math.cos(k*x0))<0.06){ imesh.setColorAt(i,new THREE.Color(0xff4444)); } else { imesh.setColorAt(i,new THREE.Color(p.mode==='long'?0xffcc44:0x66ccff)); }
      m.setPosition(X,Y*sc*2,0); imesh.setMatrixAt(i,m); pos[i*3]=X; pos[i*3+1]=Y*sc*2; pos[i*3+2]=0; }
    imesh.instanceMatrix.needsUpdate=true; if(imesh.instanceColor) imesh.instanceColor.needsUpdate=true; curve.geometry.attributes.position.needsUpdate=true; curve.visible=p.mode!=='long';
    const xm=p.lam/4; const um=xi(xm,t); mark.position.set(p.mode==='long'?xm+um:xm,p.mode==='long'?0.5:um*2,0);
    const xs=[],ys=[]; for(let i=0;i<=300;i++){ const x=-XL+2*XL*i/300; xs.push(x); ys.push(xi(x,t)); }
    S.plots.s.draw({xmin:-XL,xmax:XL,ymin:-2.1,ymax:2.1,series:[{x:xs,y:ys,color:'#0072c6'}],markers:[{x:xm,y:um}]});
    const t0=Math.max(0,t-4*T),t1=Math.max(4*T,t); const ts=[],yt=[]; for(let i=0;i<=300;i++){ const u=t0+(t1-t0)*i/300; ts.push(u); yt.push(xi(xm,u)); }
    S.plots.t.draw({xmin:t0,xmax:t1,ymin:-2.1,ymax:2.1,series:[{x:ts,y:yt,color:'#d6232a'}],markers:[{x:t,y:um}]});
    S.setRO('v',v.toFixed(3)); S.setRO('k',k.toFixed(3)); S.setRO('w',w.toFixed(3)); S.setRO('T',T.toFixed(3)); S.tag('t = '+t.toFixed(2)+' с');
  }
});
</script></body></html>
