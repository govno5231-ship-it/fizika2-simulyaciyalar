<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Электрмагниттік толқын</title><link rel="stylesheet" href="sim.css"></head>
<body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="sim.js"></script>
<script>
const NS=44, XL=12, C=3e8, E0c=8.854187817e-12, MU0=4e-7*Math.PI; let AE=[],AB=[],AS=[],curE,curB;
function line(col){ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(200*3),3)); const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:col})); l.frustumCulled=false; return l; }
Sim.init({
  lecture:'Дәріс 6 · Максвелл теңдеулері · Толқындар', title:'Жазық электрмагниттік толқын',
  formulas:['E = E<sub>0</sub>cos(ωt − kx),&nbsp; B = B<sub>0</sub>cos(ωt − kx)','B<sub>0</sub> = E<sub>0</sub>/c,&nbsp; c = 1/√(ε<sub>0</sub>μ<sub>0</sub>) ≈ 3·10⁸ м/с','Умов–Пойнтинг векторы: S = (1/μ<sub>0</sub>)[E × B],&nbsp; ⟨S⟩ = ε<sub>0</sub>cE<sub>0</sub>²/2','λ = c/ν,&nbsp; k = 2π/λ'],
  symbols:'E — электр өрісінің кернеулігі, B — магнит индукциясы, S — энергия ағынының тығыздығы, c — жарық жылдамдығы.',
  controls:[
    {id:'E0',label:'Амплитуда E₀',min:1,max:100,step:1,value:60,unit:'В/м',dec:0},
    {id:'lam',label:'Толқын ұзындығы λ',min:2,max:12,step:0.1,value:6,unit:'м',dec:1},
    {id:'sp',label:'Анимация жылдамдығы',min:0.1,max:2,step:0.1,value:1,unit:'×',dec:1},
    {id:'show',type:'select',label:'Көрсету',value:'all',options:[['all','E, B және S векторлары'],['E','Тек E (электр өрісі)'],['B','Тек B (магнит өрісі)']]}
  ],
  readouts:[{id:'nu',label:'Жиілік ν, МГц'},{id:'B0',label:'B₀, нТл'},{id:'I',label:'Қарқындылық ⟨S⟩, мВт/м²'},{id:'u',label:'Энергия тығыздығы ⟨w⟩, нДж/м³'},{id:'ph',label:'E мен B фаза айырымы'},{id:'dir',label:'E×B бағыты'}],
  plots:[{id:'e',title:'E(x) — электр өрісі',xlabel:'x, м',ylabel:'E, В/м'},{id:'b',title:'B(x) — магнит өрісі',xlabel:'x, м',ylabel:'B, нТл'}],
  theory:'<p>Максвелл теңдеулерінен электрмагниттік толқынның көлденең екені шығады: E ⟂ B ⟂ таралу бағыты, ал E, B және v оң бұрандалы жүйе құрайды. E мен B бір фазада тербеледі, және B<sub>0</sub> = E<sub>0</sub>/c.</p><p>Қызғылт сары жебелер — Умов–Пойнтинг векторы: ол әрқашан таралу бағытында (+x), яғни энергия ағыны толқынмен бірге жүреді.</p>',
  result:'<b>Бақылау:</b> E₀-ді арттырсақ, қарқындылық E₀²-қа пропорционал өседі. λ-ны өзгерткенде жиілік ν = c/λ өзгереді, ал E мен B фазасы әрқашан сәйкес.',
  camera:{r:24,th:1.2,ph:0.65,target:[0,0,0]},
  setup(c){ const {scene,THREE}=c; scene.add(Sim.grid(28,-5));
    for(let i=0;i<NS;i++){ AE.push(Sim.arrow(0x4aa8ff,1,0.25,0.15)); AB.push(Sim.arrow(0xff5577,1,0.25,0.15)); AS.push(Sim.arrow(0xffaa33,1,0.25,0.15)); scene.add(AE[i],AB[i],AS[i]); }
    curE=line(0x4aa8ff); curB=line(0xff5577); scene.add(curE,curB);
    const ax=new THREE.Mesh(new THREE.BoxGeometry(XL*2+1,0.03,0.03),new THREE.MeshBasicMaterial({color:0xaaccee})); scene.add(ax);
    const lx=Sim.label('x (таралу)',{size:0.9}); lx.position.set(XL+1.5,0.7,0); scene.add(lx);
    const ly=Sim.label('E',{size:0.9,color:'#4aa8ff'}); ly.position.set(-XL-0.5,3.6,0); scene.add(ly);
    const lz=Sim.label('B',{size:0.9,color:'#ff5577'}); lz.position.set(-XL-0.5,0.4,3.6); scene.add(lz); },
  reset(c){},
  frame(dt,c,run){
    const S=c.S,p=S.params; if(run) S.t+=dt*p.sp; const t=S.t; const nu=C/p.lam, k=2*Math.PI/p.lam; const w=2*Math.PI/ p.lam*1; /* шартты (көрнекілік) */
    const phase=(x)=>w*t*0.8-k*x; const Ve=new THREE.Vector3(), amp=p.E0/100*3.2;
    const posE=curE.geometry.attributes.position.array, posB=curB.geometry.attributes.position.array;
    for(let i=0;i<200;i++){ const x=-XL+2*XL*i/199; const f=Math.cos(phase(x)); posE[i*3]=x;posE[i*3+1]=f*amp;posE[i*3+2]=0; posB[i*3]=x;posB[i*3+1]=0;posB[i*3+2]=f*amp; }
    curE.geometry.attributes.position.needsUpdate=true; curB.geometry.attributes.position.needsUpdate=true; curE.visible=p.show!=='B'; curB.visible=p.show!=='E';
    for(let i=0;i<NS;i++){ const x=-XL+2*XL*i/(NS-1); const f=Math.cos(phase(x)); const L=Math.abs(f)*amp;
      AE[i].visible=p.show!=='B'&&L>0.05; AB[i].visible=p.show!=='E'&&L>0.05; AS[i].visible=p.show==='all'&&L>0.01;
      if(AE[i].visible){ AE[i].position.set(x,0,0); AE[i].setDirection(new THREE.Vector3(0,Math.sign(f),0)); AE[i].setLength(L,Math.min(0.3,L),0.15); }
      if(AB[i].visible){ AB[i].position.set(x,0,0); AB[i].setDirection(new THREE.Vector3(0,0,Math.sign(f))); AB[i].setLength(L,Math.min(0.3,L),0.15); }
      if(AS[i].visible){ const s=f*f*amp*amp/3.2*0.5; AS[i].position.set(x,-1.2,0); AS[i].setDirection(new THREE.Vector3(1,0,0)); AS[i].setLength(Math.max(0.05,s),Math.min(0.3,Math.max(0.05,s)),0.12); } }
    const B0=p.E0/C, I=0.5*E0c*C*p.E0*p.E0, uu=0.5*E0c*p.E0*p.E0; // ⟨w⟩ = ε0E0²/2
    const xs=[],ye=[],yb=[]; for(let i=0;i<=300;i++){ const x=-XL+2*XL*i/300; xs.push(x); const f=Math.cos(phase(x)); ye.push(p.E0*f); yb.push(B0*1e9*f); }
    S.plots.e.draw({xmin:-XL,xmax:XL,ymin:-105,ymax:105,series:[{x:xs,y:ye,color:'#1f7fdc'}]});
    S.plots.b.draw({xmin:-XL,xmax:XL,ymin:-105/C*1e9*1.05,ymax:105/C*1e9*1.05,series:[{x:xs,y:yb,color:'#d6234a'}]});
    S.setRO('nu',(nu/1e6).toFixed(2)); S.setRO('B0',(B0*1e9).toFixed(3)); S.setRO('I',(I*1e3).toFixed(3)); S.setRO('u',(uu*1e9).toFixed(3)); S.setRO('ph','0 (бір фазада)'); S.setRO('dir','+x (таралу бағыты)');
    S.tag('Көрнекілік: нақты толқын жылдамдығы c = 3·10⁸ м/с, анимация баяулатылған');
  }
});
</script></body></html>
