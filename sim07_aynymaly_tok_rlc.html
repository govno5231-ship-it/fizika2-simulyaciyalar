<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Айнымалы ток: R, L, C тізбегі және резонанс</title><link rel="stylesheet" href="sim.css"></head>
<body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="sim.js"></script>
<script>
let ph={},wu,wi,du,di;
function mkLine(col,n){ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3)); const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:col})); l.frustumCulled=false; return l; }
function calc(p){ const w=2*Math.PI*p.f, L=p.L*1e-3, C=p.C*1e-6, XL=w*L, XC=1/(w*C), X=XL-XC, Z=Math.hypot(p.R,X), I0=p.U0/Z, phi=Math.atan2(X,p.R); return {w,L,C,XL,XC,X,Z,I0,phi}; }
Sim.init({
  lecture:'Дәріс 4 · Айнымалы ток', title:'Айнымалы ток тізбегі: R, L, C тізбектей жалғану. Кернеу резонансы',
  formulas:['u = U<sub>0</sub>cos ωt,&nbsp; i = I<sub>0</sub>cos(ωt − φ)','X<sub>L</sub> = ωL,&nbsp; X<sub>C</sub> = 1/(ωC),&nbsp; Z = √[R² + (ωL − 1/ωC)²]','I<sub>0</sub> = U<sub>0</sub>/Z,&nbsp; tg φ = (ωL − 1/ωC)/R','Резонанс: ω<sub>рез</sub> = 1/√(LC),&nbsp; P = ½U<sub>0</sub>I<sub>0</sub>cos φ'],
  symbols:'R — активті кедергі, X<sub>L</sub> — индуктивті, X<sub>C</sub> — сыйымдылық кедергі, Z — толық кедергі, φ — ток пен кернеу арасындағы фазалар айырымы.',
  controls:[
    {id:'U0',label:'Кернеу амплитудасы U₀',min:10,max:310,step:5,value:100,unit:'В',dec:0},
    {id:'R',label:'Активті кедергі R',min:1,max:200,step:1,value:20,unit:'Ом',dec:0},
    {id:'L',label:'Индуктивтілік L',min:1,max:200,step:1,value:50,unit:'мГн',dec:0},
    {id:'C',label:'Сыйымдылық C',min:1,max:200,step:1,value:20,unit:'мкФ',dec:0},
    {id:'f',label:'Жиілік ν',min:10,max:1500,step:1,value:150,unit:'Гц',dec:0}
  ],
  readouts:[{id:'XL',label:'X_L, Ом'},{id:'XC',label:'X_C, Ом'},{id:'Z',label:'Z, Ом'},{id:'I0',label:'I₀, А'},{id:'phi',label:'φ, °'},{id:'P',label:'Қуат P (орташа), Вт'},{id:'f0',label:'ν_рез, Гц'},{id:'Q',label:'Сапалылық Q'},{id:'type',label:'Сипаты'}],
  plots:[{id:'w',title:'u(t) және i(t)',xlabel:'t/T (периодтар)',ylabel:'u, В · 10·i, А'},{id:'r',title:'Резонанстық қисық I₀(ν)',xlabel:'ν, Гц',ylabel:'I₀, А'}],
  theory:'<p>Тізбектей R–L–C тізбегінде токтың амплитудасы жиілікке тәуелді. X<sub>L</sub> = X<sub>C</sub> болғанда Z = R минимал, ток максимал — <b>кернеу резонансы</b>; φ = 0, кернеу мен ток бір фазада.</p><p>3D суретте фазорлар (айналатын векторлар): U<sub>R</sub> токпен бір фазада, U<sub>L</sub> токтан 90° озады, U<sub>C</sub> 90° қалады.</p>',
  result:'<b>Тексеріңіз:</b> ν-ны ν<sub>рез</sub> мәніне келтіріңіз — I₀ = U₀/R, U<sub>L</sub> мен U<sub>C</sub> өзара теңеседі (және U₀-ден көп болуы мүмкін). ν &lt; ν<sub>рез</sub> болса, тізбек сыйымдылықты (φ &lt; 0), ν &gt; ν<sub>рез</sub> болса — индуктивті (φ &gt; 0).',
  camera:{r:26,th:1.2,ph:0.3,target:[1,0,0]},
  setup(c){ const {scene,THREE}=c; scene.add(Sim.grid(30,-6));
    const cols={U:0xffffff,R:0x66ff99,L:0xffaa33,C:0x66ccff,I:0xff4466};
    for(const k in cols){ ph[k]=Sim.arrow(cols[k],1,0.4,0.25); ph[k].position.set(-9,0,0); scene.add(ph[k]); }
    const ring=new THREE.Mesh(new THREE.RingGeometry(4.6,4.65,64),new THREE.MeshBasicMaterial({color:0x5588aa,side:2})); ring.position.set(-9,0,0); scene.add(ring);
    const lb=(txt,col,x,y)=>{ const s=Sim.label(txt,{size:0.9,color:col}); s.position.set(x,y,0); scene.add(s); };
    lb('U','#ffffff',-5,3.5); lb('U_R, I','#66ff99',-5,2.4); lb('U_L','#ffaa33',-5,1.3); lb('U_C','#66ccff',-5,0.2);
    wu=mkLine(0xffffff,300); wi=mkLine(0xff4466,300); scene.add(wu,wi);
    [0xffffff,0xff4466].forEach((col,i)=>{ const m=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,10),new THREE.MeshBasicMaterial({color:col})); scene.add(m); if(i)di=m; else du=m; });
    const ax=new THREE.Mesh(new THREE.BoxGeometry(14,0.03,0.03),new THREE.MeshBasicMaterial({color:0x5588aa})); ax.position.set(7,0,0); scene.add(ax); },
  reset(c){},
  frame(dt,c,run){
    const S=c.S,p=S.params; if(run) S.t+=dt; const q=calc(p); const th=2*Math.PI*0.4*S.t; // көрнекі айналу 0,4 айн/с
    const ur=q.I0*p.R, ul=q.I0*q.XL, uc=q.I0*q.XC; const mx=Math.max(p.U0,ur,ul,uc,1e-9), sc=4.2/mx;
    const ang=(a,len,key)=>{ const A=ph[key]; A.setDirection(new THREE.Vector3(Math.cos(a),Math.sin(a),0)); A.setLength(Math.max(0.02,len*sc),Math.min(0.4,len*sc),0.2); };
    ang(th,p.U0,'U'); const ai=th-q.phi; ang(ai,q.I0*mx/ Math.max(q.I0,1e-9)*0+ ur,'R'); ang(ai+Math.PI/2,ul,'L'); ang(ai-Math.PI/2,uc,'C'); ang(ai,Math.max(ur,0.0001)*1.0,'I'); ph.I.setLength(0.01,0.01,0.01); ph.I.visible=false;
    const Nn=300, pa=wu.geometry.attributes.position.array, pb=wi.geometry.attributes.position.array, xs=[],yu=[],yi=[]; const per=3;
    const imx=q.I0; const iscale=p.U0/ (imx||1); // i бейнеленуі: амплитудаларды салыстыру үшін 10·i
    for(let n=0;n<Nn;n++){ const tt=per*n/(Nn-1); const a=2*Math.PI*tt; const uu=p.U0*Math.cos(a), ii=q.I0*Math.cos(a-q.phi); xs.push(tt); yu.push(uu); yi.push(ii*10);
      pa[n*3]=tt*4.2;pa[n*3+1]=uu/mx*3.2*1;pa[n*3+2]=0; pb[n*3]=tt*4.2;pb[n*3+1]=ii*10/ (Math.max(p.U0,q.I0*10))*3.2;pb[n*3+2]=0; }
    wu.geometry.attributes.position.needsUpdate=true; wi.geometry.attributes.position.needsUpdate=true; wu.position.x=0; wi.position.x=0;
    const ph0=(th/(2*Math.PI))%1; const a0=2*Math.PI*ph0; du.position.set(ph0*4.2,p.U0*Math.cos(a0)/mx*3.2*1,0); di.position.set(ph0*4.2,q.I0*10*Math.cos(a0-q.phi)/Math.max(p.U0,q.I0*10)*3.2,0);
    const m=Math.max(p.U0,q.I0*10); S.plots.w.draw({xmin:0,xmax:per,ymin:-m*1.1,ymax:m*1.1,series:[{x:xs,y:yu,color:'#555',label:'u'},{x:xs,y:yi,color:'#d6232a',label:'10·i'}],markers:[{x:ph0,y:p.U0*Math.cos(a0)},{x:ph0,y:q.I0*10*Math.cos(a0-q.phi)}]});
    const f0=1/(2*Math.PI*Math.sqrt(q.L*q.C)); const fx=[],fy=[]; for(let i=0;i<=300;i++){ const f=10+i*(1500-10)/300; const w=2*Math.PI*f; const Z=Math.hypot(p.R,w*q.L-1/(w*q.C)); fx.push(f); fy.push(p.U0/Z); }
    S.plots.r.draw({xmin:10,xmax:1500,ymin:0,ymax:Math.max(...fy)*1.1,series:[{x:fx,y:fy,color:'#0072c6'}],markers:[{x:p.f,y:q.I0}],vlines:[{x:Math.min(1500,f0)}]});
    S.setRO('XL',q.XL.toFixed(2)); S.setRO('XC',q.XC.toFixed(2)); S.setRO('Z',q.Z.toFixed(2)); S.setRO('I0',q.I0.toFixed(4)); S.setRO('phi',(q.phi*180/Math.PI).toFixed(1));
    S.setRO('P',(0.5*p.U0*q.I0*Math.cos(q.phi)).toFixed(3)); S.setRO('f0',f0.toFixed(1)); S.setRO('Q',((1/p.R)*Math.sqrt(q.L/q.C)).toFixed(2)); S.setRO('type',Math.abs(q.X)<0.02*Math.max(q.XL,q.XC)?'резонанс':(q.X>0?'индуктивті':'сыйымдылықты'));
    S.tag('Фазорлар (сол жақта) және u(t), i(t) (оң жақта). Көрнекі айналу: 0,4 айн/с');
  }
});
</script></body></html>
